name: inspecto_shield_partner
description: A new Flutter project.
publish_to: 'none'

version: 1.0.4+4

environment:
  sdk: '>=3.1.5 <4.0.0'

dependencies:
  flutter:
    sdk: flutter  
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.2
  loading_icon_button: ^0.0.6
  provider: ^6.1.1
  intl: ^0.20.2
  http: ^1.2.0
  image_picker: ^1.0.7
  image: ^4.1.7
  path_provider: ^2.1.3
  lottie: ^3.1.2
  connectivity_plus: ^6.0.3
  internet_connection_checker: ^1.0.0+1
  change_app_package_name: ^1.4.0
  mobile_scanner: ^6.0.5
  rflutter_alert: ^2.0.7
  shared_preferences: ^2.5.3
  firebase_core: ^4.4.0
  firebase_messaging: ^16.1.1
  flutter_local_notifications: ^17.0.0
  audioplayers: ^6.5.1
  flutter_secure_storage: ^10.0.0
  record: ^6.2.0
  http_parser: ^4.0.2
  just_audio: ^0.10.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^2.0.0


flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/inspecto_partner_logo.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/icon/
    - assets/icon/inspecto_partner_logo.png
    - assets/lang/en.json
    - assets/lang/ar.json
    - assets/animations/success.json
    - assets/sounds/
    - assets/alarm_light.gif